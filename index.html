<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYNX STREETWEAR</title>
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, #000000, #111827, #1f2937);
            color: #ffffff;
            min-height: 100vh;
        }

        /* Navbar Styling */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #d1d5db;
        }

        /* Hero Section */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1.5rem;
        }

        .hero h2 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .hero p {
            color: #d1d5db;
            margin-bottom: 1.5rem;
            font-size: 1.125rem;
        }

        /* Shared Button Styles */
        .btn {
            display: inline-block;
            cursor: pointer;
            border: none;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #ffffff;
            color: #000000;
            padding: 0.75rem 1.5rem;
            border-radius: 1rem;
        }

        .btn-primary:hover {
            background-color: #e5e7eb;
        }

        .btn-full {
            width: 100%;
            margin-top: 0.75rem;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            background-color: #ffffff;
            color: #000000;
        }

        .btn-full:hover {
            background-color: #e5e7eb;
        }

        /* Products Grid */
        .shop-section {
            padding: 2.5rem 1.5rem;
            max-width: 64rem;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        /* Card Component Styling */
        .card {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1rem;
        }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 0.75rem;
            display: block;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .card img.mb-2 {
            margin-bottom: 0.5rem;
        }

        .card img.mb-4 {
            margin-bottom: 1rem;
        }

        .card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .card p {
            color: #9ca3af;
        }

        /* About Section */
        .about-section {
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        .about-section h2 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .about-section p {
            color: #9ca3af;
            max-width: 36rem;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            padding: 1.5rem;
            text-align: center;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.875rem;
        }

        /* Responsive Layout Breakpoints */
        @media (min-width: 768px) {
            .hero h2 {
                font-size: 4rem;
            }
            .shop-section {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <h1>KYNX</h1>
        <div class="nav-links">
            <a href="#shop">Shop</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h2>KYNX STREETWEAR</h2>
        <p>Minimal. Bold. Everyday essentials.</p>
        <button class="btn btn-primary">Shop Now</button>
    </section>

    <!-- Products Section -->
    <section id="shop" class="shop-section">
        
        <!-- T-Shirt Card -->
        <div class="card">
            <img src="https://files.tapstitch.com/hugepod/material/custom_printing/f7bc3692c5734bfd9f7cfcd5faa73706.png" alt="KYNX Tee" class="mb-4">
            <h3>KYNX Tee</h3>
            <p>$39.99</p>
            <button class="btn btn-full">Buy Now</button>
        </div>

        <!-- Hoodie Card -->
        <div class="card">
            <img src="/mnt/data/image.png" alt="KYNX Hoodie Front" class="mb-2">
            <img src="/mnt/data/image.png" alt="KYNX Hoodie Back" class="mb-4">
            <h3>KYNX Hoodie</h3>
            <p>$69.99</p>
            <button class="btn btn-full">Buy Now</button>
        </div>

    </section>

    <!-- About Section -->
    <section id="about" class="about-section">
        <h2>About KYNX</h2>
        <p>KYNX is a modern streetwear brand focused on clean design, bold identity, and premium comfort. Built for everyday wear.</p>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 KYNX. All rights reserved.</p>
    </footer>

</body>
</html>
